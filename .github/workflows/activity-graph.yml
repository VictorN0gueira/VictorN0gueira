name: Generate Activity Graph

on:
  # Roda a cada 12 horas pra manter o gráfico atualizado
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  # Roda sempre que houver push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: "theme=tokyo-night&bg_color=0d1117&color=EA4B71&line=EA4B71&point=ffffff&area=true&hide_border=true"
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push activity graph to the output-activity-graph branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-activity-graph
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
