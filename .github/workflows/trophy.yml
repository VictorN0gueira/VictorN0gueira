name: Generate Trophy Card

on:
  # Roda uma vez por dia pra manter os troféus atualizados
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  # Roda sempre que houver push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=radical&no-frame=true&no-bg=true&margin-w=4&row=1&column=7"
          path: dist/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push trophy to the output-trophy branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-trophy
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
