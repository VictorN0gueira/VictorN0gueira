name: Generate Stats Cards

on:
  # Roda uma vez por dia pra manter os cards atualizados
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  # Roda sempre que houver push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&count_private=true&include_all_commits=true&bg_color=0d1117&title_color=EA4B71&icon_color=EA4B71&text_color=ffffff"
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true&langs_count=8&bg_color=0d1117&title_color=EA4B71&text_color=ffffff"
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push cards to the output-stats branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
