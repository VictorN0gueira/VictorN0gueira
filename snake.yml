name: Generate Snake Game

on:
  # Roda a cada 12 horas pra manter a cobrinha atualizada
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
  # Roda sempre que houver push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake game from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-pink.svg?color_snake=%23EA4B71&color_dots=%231a1035,%233a2a5a,%236b4b8a,%23a35bb5,%23EA4B71

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
